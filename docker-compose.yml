services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: veritor-backend:latest
    container_name: veritor-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - VERITOR_LOG_LEVEL=INFO
      - VERITOR_OLLAMA_BASE_URL=http://ollama:11434
      - VERITOR_DATABASE_URL=postgresql+psycopg://veritor:veritor@postgres:5432/veritor
      - VERITOR_CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: veritor-frontend:latest
    container_name: veritor-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    container_name: veritor-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=veritor
      - POSTGRES_PASSWORD=veritor
      - POSTGRES_DB=veritor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veritor -d veritor"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: veritor-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  ollama_data:
